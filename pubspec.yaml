name: luci_mobile
description: "iLink: a private iStoreOS management app based on LuCI Mobile"
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  fl_chart: ^1.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^11.0.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.0
  crypto: ^3.0.7
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  prism_ui:
    git:
      url: https://github.com/chen08209/prism_ui.git
      ref: 63450c0ac0e8e1b2c0f3ed4ad7926dc94e083185

dependency_overrides:
  # Android-only: skip the Apple-only native hook that fails on Windows paths
  # containing spaces. Android uses path_provider_android.
  path_provider_foundation:
    path: tool/android_only_plugins/path_provider_foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
